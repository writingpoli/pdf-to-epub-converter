name: CI

# Runs when started by hand (Actions → CI → Run workflow) or for a version
# tag. Publishes the app on the Releases page for a tag like v1.2.0, or for
# a manual run given a version number.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Build and upload the app (off for a quicker, cheaper test-only run)"
        type: boolean
        default: true
      release:
        description: "Version to publish on the Releases page, such as 1.2.0 (leave empty for none)"
        type: string
        default: ""
  push:
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      # Print where a crash happened, if one does.
      SWIFT_BACKTRACE: enable=yes,sanitize=yes,interactive=no
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Diagnostic reports for sample pages
        if: always()
        run: |
          swift run pdf2epub Tests/Fixtures/alice-sample.pdf --diagnose 10
          swift run pdf2epub Tests/Fixtures/embedded-fonts.pdf --diagnose 1

      - name: Show what PDFKit reads from the note pages
        if: always()
        run: |
          swift run pdf2epub Tests/Fixtures/alice-sample.pdf --dump-lines lines.json --verbose
          python3 - <<'PY'
          import json
          dump = json.load(open("lines.json"))
          print("Fonts:", [(f["name"], f["characters"], f["bold"], f["italic"]) for f in dump.get("fonts", [])])
          lines = dump["lines"]
          for l in lines:
              text = "".join(r["text"] for r in l["runs"])
              if l["page"] in (3, 7, 11) or "Liddell" in text or any(r.get("superscript") for r in l["runs"]):
                  runs = [(r["text"][-12:], "sup" if r.get("superscript") else "") for r in l["runs"]]
                  print(l["page"], round(l["y"], 1), round(l["fontSize"], 1), round(l["x"], 1), round(l["width"], 1), runs[-3:])
          PY

      - name: Build the app
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app || inputs.release != '' }}
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          # A version tag (v1.2.0) or a release version sets the app's version.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "$RELEASE" ]]; then export VERSION="${RELEASE#v}"; fi
          scripts/build-app.sh universal

      - name: Convert the sample PDFs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app || inputs.release != '' }}
        run: |
          mkdir -p dist/samples
          CLI="dist/PDF to EPUB.app/Contents/Resources/pdf2epub"
          "$CLI" Tests/Fixtures/alice-sample.pdf -o dist/samples/alice-sample.epub
          "$CLI" Tests/Fixtures/alice-no-bookmarks.pdf -o dist/samples/alice-no-bookmarks.epub

      - name: Validate with EPUBCheck
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app || inputs.release != '' }}
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q epubcheck.zip
          for f in dist/samples/*.epub; do java -jar epubcheck-5.1.0/epubcheck.jar "$f"; done

      - name: Package
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app || inputs.release != '' }}
        run: ditto -c -k --keepParent "dist/PDF to EPUB.app" "dist/PDF-to-EPUB.zip"

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app || inputs.release != '' }}
        with:
          name: PDF-to-EPUB-app
          path: dist/PDF-to-EPUB.zip

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app || inputs.release != '' }}
        with:
          name: sample-epubs
          path: dist/samples/*.epub

      - name: Publish the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ -n "$RELEASE" ]]; then TAG="v${RELEASE#v}"; fi
          cat > notes.md <<'NOTES'
          Download **PDF-to-EPUB.zip** below, unzip it and drag **PDF to EPUB.app** into Applications. Needs macOS 13 or later.

          The app isn't notarized by Apple, so the first time you open it macOS will say it can't check it. On macOS 15 or later, open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**. On earlier versions, right-click the app, choose **Open**, then **Open** again.

          Personal, non-commercial use only; see [LICENSE](https://github.com/${{ github.repository }}/blob/main/LICENSE).
          NOTES
          gh release create "$TAG" dist/PDF-to-EPUB.zip --target "$GITHUB_SHA" \
            --title "PDF to EPUB ${TAG#v}" --notes-file notes.md --generate-notes
